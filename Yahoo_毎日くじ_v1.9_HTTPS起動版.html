<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yahoo!毎日くじ v1.9 HTTPS起動</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color-scheme:light}body{margin:0;background:#f4f6fa;color:#1d2939}.wrap{max-width:650px;margin:auto;padding:20px 16px 80px}h1{font-size:24px}.panel{background:#fff;border-radius:16px;padding:17px;margin:14px 0;box-shadow:0 2px 10px #0001}p{line-height:1.6}.muted{font-size:13px;color:#566474}.btn{border:0;border-radius:10px;background:#1367d2;color:white;padding:11px 13px;font-weight:650;cursor:pointer}.secondary{background:#e6eefb;color:#1d518e}.danger{background:#ffe6e6;color:#9a2626}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:12px 0;border-bottom:1px solid #eee}.itemname{font-weight:700}.url{overflow-wrap:anywhere;font-size:12px;color:#576981;margin:5px 0}input[type=text],input[type=url],select,textarea{box-sizing:border-box;width:100%;font-size:16px;padding:10px;border:1px solid #c7d2df;border-radius:8px}input[type=checkbox]{width:20px;height:20px}label{display:block;margin:10px 0}.note{background:#fff6e7;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}#editor{display:none}#result{white-space:pre-wrap}button{margin:3px 0}</style></head><body><main class="wrap"><h1>🎁 Yahoo!毎日くじ v1.9</h1><p class="muted">GitHub Pages・Brave用 HTTPS起動版。保存データは旧版と共通です。抽選操作は手動です。</p><section class="panel"><h2>くじ一覧</h2><div id="items"></div><div class="flex"><button class="btn secondary" id="add">＋ くじを追加</button><button class="btn secondary" id="backup">設定をバックアップ</button><button class="btn secondary" id="restore">設定を復元</button><button class="btn secondary" id="restoreInitial">初期の5件を復元</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div><div id="editor"><label>名前<input id="editName" type="text" maxlength="100"></label><label>URL<input id="editUrl" type="url"></label><div class="flex"><button class="btn" id="saveItem">保存</button><button class="btn secondary" id="cancel">キャンセル</button></div></div></section><section class="panel"><h2>くじを開く（HTTPS）</h2><p class="note">通常のHTTPSリンクで開きます。Braveでこのページを閲覧中なら、BraveでYahoo!のくじに移動できます。移動後はブラウザの「戻る」でこの画面に戻ってください。iPhoneの制限があるため、複数タブの自動一括起動は行いません。</p><div class="flex"><button class="btn" id="next">次の有効なくじを開く</button><button class="btn secondary" id="reset">先頭から</button><button class="btn secondary" id="copy">有効URLをコピー</button></div><p id="result" class="muted" role="status">未実行</p><p class="muted">1件ずつ開く方式です。開いた履歴は「起動要求」であり、抽選完了の記録ではありません。</p></section><section class="panel"><h2>操作履歴</h2><div class="flex"><button class="btn secondary" id="export">CSV出力</button><button class="btn danger" id="clear">履歴削除</button></div><div id="logs" class="muted"></div></section></main><script>
'use strict';
const KEY='yahoo-kuji-v2',INITIAL=[{name:'宝箱くじ',url:'https://takarabako.yahoo.co.jp/?sc_e=ytclife_m2cwithlp_tkbkkujisp&kuji_layout=a&kuji_expand=2',enabled:true},{name:'スロットくじ',url:'https://toku.yahoo.co.jp/appslot/lot?sc_e=ytcsvc_m2cwithlp_kujiapp',enabled:true},{name:'ズバトク',url:'https://toku.yahoo.co.jp/?sc_e=ytcsvc_m2cwithlp_zbtksp',enabled:true},{name:'おみくじ（2026年10月）',url:'https://toku.yahoo.co.jp/omikuji202610/lot?sc_e=ytcsvc_m2cwithlp_zbtksp.other',enabled:true},{name:'キャンペーンくじ（2026年10月）',url:'https://toku.yahoo.co.jp/exc-ebj202610mc/lot?sc_e=ytcsvc_m2cwithlp_zbtksp.other',enabled:true}];
const $=id=>document.getElementById(id);const valid=u=>{try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)&&!!x.hostname}catch{return false}};const defaults=()=>({time:'07:00',wait:'3',items:INITIAL.map(x=>({...x})),cursor:0,current:null,logs:[]});let state;
try{let raw=JSON.parse(localStorage.getItem(KEY)||'null');state=raw&&Array.isArray(raw.items)?raw:defaults();state.items=state.items.filter(x=>x&&typeof x.name==='string'&&typeof x.url==='string'&&valid(x.url)).map(x=>({name:x.name,url:x.url,enabled:x.enabled!==false}));state.logs=Array.isArray(state.logs)?state.logs:[]}catch{state=defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('保存できません。保存領域を確認してください');return false}}function log(name,status){state.logs.unshift({at:new Date().toISOString(),name,status});state.logs=state.logs.slice(0,1000);save();drawLogs()}
const btn=(text,fn,cls='secondary')=>{let b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;return b};let editing=null;
function render(){let root=$('items');root.replaceChildren();state.items.forEach((it,i)=>{let row=document.createElement('div');row.className='item';let top=document.createElement('div');top.className='flex';let c=document.createElement('input');c.type='checkbox';c.checked=it.enabled;c.onchange=()=>{it.enabled=c.checked;save()};let name=document.createElement('span');name.className='itemname';name.textContent=it.name;top.append(c,name);let url=document.createElement('div');url.className='url';url.textContent=it.url;let tools=document.createElement('div');tools.className='flex';tools.append(btn('開く（HTTPS）',()=>openOne(it,i)),btn('編集',()=>edit(i)),btn('↑',()=>move(i,-1)),btn('↓',()=>move(i,1)),btn('削除',()=>remove(i),'danger'));row.append(top,url,tools);root.append(row)});drawLogs()}
function openOne(it,i){if(!valid(it.url))return;state.current=i;state.cursor=i+1;save();log(it.name,'HTTPSで開くを要求（抽選完了未確認）');window.location.assign(it.url)}
function edit(i){editing=i;$('editName').value=i===null?'':state.items[i].name;$('editUrl').value=i===null?'':state.items[i].url;$('editor').style.display='block';$('editor').scrollIntoView({block:'nearest'})}function closeEditor(){$('editor').style.display='none';editing=null}function infer(u){try{let x=new URL(u);if(x.hostname==='takarabako.yahoo.co.jp')return '宝箱くじ';if(x.pathname.includes('appslot'))return 'スロットくじ';return x.hostname.replace(/^www\./,'')}catch{return ''}}$('editUrl').onchange=()=>{if(editing===null&&!$('editName').value)$('editName').value=infer($('editUrl').value)};
$('saveItem').onclick=()=>{let name=$('editName').value.trim(),url=$('editUrl').value.trim();if(!name)name=infer(url);if(!name||name.length>100||!valid(url)){alert('名前と正しいhttps/httpのURLを入力してください');return}if(editing===null)state.items.push({name,url,enabled:true});else state.items[editing]={...state.items[editing],name,url};save();closeEditor();render()};$('cancel').onclick=closeEditor;$('add').onclick=()=>edit(null);
function move(i,d){let j=i+d;if(j<0||j>=state.items.length)return;[state.items[i],state.items[j]]=[state.items[j],state.items[i]];state.cursor=0;state.current=null;save();render()}function remove(i){if(!confirm('「'+state.items[i].name+'」を削除しますか？'))return;state.items.splice(i,1);state.cursor=0;state.current=null;save();render()}$('restoreInitial').onclick=()=>{let s=new Set(state.items.map(x=>x.url));let add=INITIAL.filter(x=>!s.has(x.url));state.items.push(...add.map(x=>({...x})));save();render();alert(add.length+'件を追加しました')};
function download(data,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1000)}$('backup').onclick=()=>download(JSON.stringify(state,null,2),'yahoo-kuji-settings.json','application/json');$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let raw=JSON.parse(await f.text());if(!Array.isArray(raw.items)||raw.items.some(x=>!x||typeof x.name!=='string'||!valid(x.url)))throw Error('不正な設定');if(!confirm('現在の登録と履歴をバックアップで置き換えますか？'))return;state={...defaults(),...raw,items:raw.items.map(x=>({...x,enabled:x.enabled!==false})),logs:Array.isArray(raw.logs)?raw.logs:[]};save();render()}catch(err){alert('復元できません: '+err.message)}finally{e.target.value=''}};
function eligible(n){let e=state.items.filter(x=>x.enabled&&valid(x.url));return n?e.slice(0,n):e}
function payload(n){return eligible(n).map(x=>x.url).join('\n')}
function nextItem(){const selected=state.items.map((it,i)=>({...it,i})).filter(x=>x.enabled&&valid(x.url));if(!selected.length){$('result').textContent='有効なURLがありません';return}const candidate=selected.find(x=>x.i>=state.cursor);if(!candidate){$('result').textContent='最後まで進みました。「先頭から」で再開できます。';return}$('result').textContent=`${candidate.name} を開きます（${selected.indexOf(candidate)+1}/${selected.length}件）`;openOne(candidate,candidate.i)}
$('next').onclick=nextItem;
$('reset').onclick=()=>{state.cursor=0;state.current=null;save();$('result').textContent='先頭に戻しました'};
$('copy').onclick=async()=>{let s=payload(null);try{await navigator.clipboard.writeText(s);$('result').textContent='有効なURLをコピーしました'}catch{prompt('URL一覧をコピーしてください',s)}};
function drawLogs(){let root=$('logs');root.replaceChildren();state.logs.slice(0,40).forEach(l=>{let p=document.createElement('p');p.textContent=(l.at||'')+'　'+(l.name||'')+'　'+(l.status||'');root.append(p)});if(!state.logs.length)root.textContent='まだ履歴はありません'}$('clear').onclick=()=>{if(confirm('履歴を削除しますか？')){state.logs=[];save();drawLogs()}};$('export').onclick=()=>{let q=s=>'"'+String(s||'').replaceAll('"','""')+'"';download('\ufeff'+[['日時','くじ','状態'],...state.logs.map(x=>[x.at,x.name,x.status])].map(r=>r.map(q).join(',')).join('\r\n'),'yahoo-kuji-log.csv','text/csv;charset=utf-8')};render();
</script></body></html>
